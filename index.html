<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700;800&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<style>
:root{--f:'Noto Sans Kannada','Nudi 01 e','Nudi Akshara','Tunga','Kedage',system-ui,sans-serif;--lh:1.75;--hl:1.4;--mf:Fraunces,Georgia,serif;--paper:#f4f6f1;--grid:#dfe5db;--ink:#14213d;--soft:#4a5673;--gold:#f2a900;--teal:#12877a;--coral:#e4572e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#0f1a2e;--grid:#1a2742;--ink:#f1f4ee;--soft:#a9b4cc;--card:#17243d}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--f);line-height:var(--lh);color:var(--ink);background:var(--paper);padding-bottom:64px;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
nav{display:flex;gap:8px;align-items:center;padding:12px 20px;flex-wrap:wrap}
nav button,.ctl button{font:inherit;font-size:1rem;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:2px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.poster{display:none;min-height:calc(100vh - 130px);padding:10px 28px 40px;grid-template-columns:minmax(260px,5fr) 7fr;gap:36px;align-items:start}
.poster.on{display:grid}
h1{font-weight:800;font-size:clamp(1.8rem,4.2vw,3.2rem);line-height:var(--hl);margin-bottom:6px}
.tag{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--teal);margin-bottom:18px}
.facts{list-style:none;padding:0;display:grid;gap:10px}
.facts li{background:var(--card);border-inline-start:6px solid var(--gold);padding:6px 16px;border-radius:12px 4px 4px 12px;font-size:1.08rem}
[dir=ltr] .facts li{border-radius:4px 12px 12px 4px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl label{display:flex;gap:6px;align-items:center;direction:ltr;font-weight:700}
.ctl input{width:92px;font:inherit;font-weight:700;padding:3px 9px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);direction:ltr}
.ctl .go{background:var(--gold);color:#14213d}
.stage{display:grid;gap:12px}
.stage>div{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 20px;font-size:clamp(1.1rem,2vw,1.4rem);opacity:0;transform:translateY(14px) scale(.98);transition:opacity .5s,transform .5s;pointer-events:none}
.stage>div.on{opacity:1;transform:none;pointer-events:auto}
.stage>div.key{background:var(--gold);color:#14213d;font-weight:700;border-color:#14213d}
.stage>div.result{background:var(--ink);color:var(--paper);font-weight:800;font-size:clamp(1.25rem,2.8vw,1.9rem)}
.stage>div.result b{color:var(--gold)}
.stage>div.bad{background:var(--coral);color:#fff}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--mf);font-weight:800;line-height:1.5}
b.hl{color:var(--coral)}b.zero{color:var(--teal);background:rgba(18,135,122,.15);padding:0 6px;border-radius:6px}
.chip{display:inline-block;direction:ltr;unicode-bidi:isolate;background:var(--gold);color:#14213d;font-family:var(--mf);font-weight:800;border-radius:8px;padding:0 10px;margin:0 2px;line-height:1.6}
small.hint{display:block;color:var(--soft);padding:0 28px 20px}
.brand{position:fixed;left:0;right:0;bottom:0;z-index:9;text-align:center;direction:ltr;padding:12px;background:var(--ink);color:var(--paper);font-family:var(--mf);font-weight:800;font-size:clamp(1rem,2.4vw,1.4rem);border-top:4px solid var(--gold);line-height:1.5}
body.clean nav,body.clean .ctl,body.clean small.hint{display:none}
body.clean .poster{min-height:100vh;padding-top:30px}
@media(max-width:820px){.poster.on{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>

<script>
const $=(s,r=document)=>r.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const M=h=>`<span class="m">${h}</span>`;
function factor(n){const m={};for(let p=2;p*p<=n;p++)while(n%p==0){m[p]=(m[p]||0)+1;n/=p}if(n>1)m[n]=(m[n]||0)+1;return m}
function fmt(m){const k=Object.keys(m).map(Number).sort((a,b)=>a-b);return k.length?k.map(p=>p+(m[p]>1?'<sup>'+m[p]+'</sup>':'')).join(' × '):'1'}
const val=m=>Object.keys(m).reduce((t,p)=>t*Math.pow(+p,m[p]),1);
const isPrime=n=>{if(n<2)return false;const f=factor(n);return Object.keys(f).length==1&&f[n]==1};
const okInt=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi;
function hl(nums){const F=nums.map(factor),H={},L={};
 new Set(F.flatMap(f=>Object.keys(f))).forEach(p=>{const es=F.map(f=>f[p]||0);L[p]=Math.max(...es);const mn=Math.min(...es);if(mn>0)H[p]=mn});
 return{F,H,L,h:val(H),l:val(L)}}
const chip=(n,f)=>`${M(n+' =')} <span class="chip">${fmt(f)}</span>`;
const hv=(T,R)=>`${T.s.hcfL}<br>${M(`= <b class="zero">${fmt(R.H)}</b> = <b>${R.h}</b>`)}`;
const lv=(T,R)=>`${T.s.lcmL}<br>${M(`= <b class="zero">${fmt(R.L)}</b> = <b>${R.l}</b>`)}`;
const res=(T,R)=>`§${T.hcf} ${M('= '+R.h)} · ${T.lcm} ${M('= '+R.l)}`;

const T={keyLabel:'ಮುಖ್ಯ ಅಂಶ:',run:'ಪ್ರಾರಂಭಿಸಿ',step:'ಮುಂದಿನ ಹಂತ',reset:'ಮರುಹೊಂದಿಸಿ',hcf:'ಮ.ಸಾ.ಅ',lcm:'ಕ.ಸಾ.ಅ',
s:{err4:'ಪೂರ್ಣ ಸಂಖ್ಯೆಯನ್ನು 4 ರಿಂದ 10,000,000 ರೊಳಗೆ ನಮೂದಿಸಿ.',prime:n=>`${n} ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆ. ಭಾಜ್ಯ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.`,
tree:'ಅಪವರ್ತನ ವೃಕ್ಷ ರಚಿಸಿ: ಪ್ರತಿ ಬಾರಿ ಚಿಕ್ಕ ಅವಿಭಾಜ್ಯದಿಂದ ಭಾಗಿಸಿ.',primes:'ಅವಿಭಾಜ್ಯ ಅಪವರ್ತನಗಳು:',unique:'ಈ ವಿಭಜನೆ ಅನನ್ಯ; ಅವಿಭಾಜ್ಯಗಳ ಕ್ರಮ ಮಾತ್ರ ಬದಲಾಗಬಹುದು.',
err2:'ಸಂಖ್ಯೆಗಳನ್ನು 2 ರಿಂದ 1,000,000 ರೊಳಗೆ ನಮೂದಿಸಿ.',err3:'ಸಂಖ್ಯೆಗಳನ್ನು 2 ರಿಂದ 10,000 ರೊಳಗೆ ನಮೂದಿಸಿ.',
hcfL:'ಮ.ಸಾ.ಅ: ಸಾಮಾನ್ಯ ಅವಿಭಾಜ್ಯಗಳ ಚಿಕ್ಕ ಘಾತಗಳು',lcmL:'ಕ.ಸಾ.ಅ: ಎಲ್ಲಾ ಅವಿಭಾಜ್ಯಗಳ ದೊಡ್ಡ ಘಾತಗಳು',chk:'ಪರಿಶೀಲನೆ:',viaH:'ಮ.ಸಾ.ಅ ಬಳಸಿ:',
prodNot:'ಗಮನಿಸಿ: ಮೂರು ಸಂಖ್ಯೆಗಳ ಗುಣಲಬ್ಧ HCF × LCM ಗೆ ಸಮನಾಗಿಲ್ಲ.',prodEq:'ಇಲ್ಲಿ ಆಕಸ್ಮಿಕವಾಗಿ ಸಮ, ಆದರೆ ಸಾಮಾನ್ಯವಾಗಿ ಹಾಗಿರುವುದಿಲ್ಲ.',
zeroIdea:'0 ಯಲ್ಲಿ ಕೊನೆಗೊಳ್ಳುವ ಸಂಖ್ಯೆ 10 = 2 × 5 ರಿಂದ ಭಾಗವಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ 2 ಮತ್ತು 5 ಎರಡೂ ಅವಿಭಾಜ್ಯ ಅಪವರ್ತನಗಳಾಗಿರಬೇಕು.',onlyP:'ವಿಭಜನೆಯಲ್ಲಿರುವ ಅವಿಭಾಜ್ಯಗಳು ಇವು ಮಾತ್ರ:',uniq:'ಅನನ್ಯತೆಯ ಕಾರಣ ಬೇರೆ ಅವಿಭಾಜ್ಯಗಳು ಇಲ್ಲ.',

prErr:'ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ (2, 3, 5, 7, 11…).',
irr:p=>[`<b>ಹಂತ 1.</b> ${M('√'+p)} ಪರಿಮೇಯ ಎಂದು ಭಾವಿಸಿ: ${M(`√${p} = a/b`)}, ಇಲ್ಲಿ a ಮತ್ತು b ಸಹ-ಅವಿಭಾಜ್ಯ, ${M('b ≠ 0')}.`,
`<b>ಹಂತ 2.</b> ಆದ್ದರಿಂದ ${M(`b√${p} = a`)}. ವರ್ಗ ಮಾಡಿ: ${M(`${p}b<sup>2</sup> = a<sup>2</sup>`)}.`,
`<b>ಹಂತ 3.</b> ${p}, ${M('a<sup>2</sup>')} ಅನ್ನು ಭಾಗಿಸುತ್ತದೆ, ಆದ್ದರಿಂದ ಪ್ರಮೇಯ 1.2 ರಿಂದ <b class="zero">${p}, a ಅನ್ನು ಭಾಗಿಸುತ್ತದೆ</b>. ${M(`a = ${p}c`)} ಎಂದು ಬರೆಯಿರಿ.`,
`<b>ಹಂತ 4.</b> ಆಗ ${M(`${p*p}c<sup>2</sup> = ${p}b<sup>2</sup>`)}, ಅಂದರೆ ${M(`b<sup>2</sup> = ${p}c<sup>2</sup>`)}.`,
`<b>ಹಂತ 5.</b> ಆದ್ದರಿಂದ ${p}, ${M('b<sup>2</sup>')} ಅನ್ನು ಭಾಗಿಸುತ್ತದೆ, ಹಾಗಾಗಿ <b class="zero">${p}, b ಅನ್ನು ಭಾಗಿಸುತ್ತದೆ</b>.`,
`<b>ಹಂತ 6.</b> ${p}, a ಮತ್ತು b ಎರಡನ್ನೂ ಭಾಗಿಸುತ್ತದೆ. <b class="hl">ಇದು a ಮತ್ತು b ಸಹ-ಅವಿಭಾಜ್ಯ ಎಂಬ ಸತ್ಯಕ್ಕೆ ವಿರುದ್ಧ.</b>`],
irrRes:p=>`ಆದ್ದರಿಂದ ${M('√'+p)} <b>ಅಪರಿಮೇಯ</b>.`,
eErr:'c ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆ ಮತ್ತು b ≠ 0 ನಮೂದಿಸಿ. ಮೈನಸ್‌ಗಾಗಿ ಋಣ b ಬಳಸಿ (5 − √3 ಗೆ a=5, b=-1, c=3). 3√2 ಗೆ a=0.',
e1:E=>`<b>ಹಂತ 1.</b> <span class="chip">${E}</span> ಪರಿಮೇಯ ಎಂದು ಭಾವಿಸಿ: ${M(E+' = r')}, ಇಲ್ಲಿ r ಪರಿಮೇಯ.`,
e2:(bt,ra,c,bd)=>`<b>ಹಂತ 2.</b> ಮೂಲವನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ: ${M(`${bt} = ${ra}`)}, ಆದ್ದರಿಂದ <b class="zero">${M(`√${c} = (${ra}) / ${bd}`)}</b>.`,
e3:(ra,bd,c)=>`<b>ಹಂತ 3.</b> r, a ಮತ್ತು b ಪರಿಮೇಯ ಮತ್ತು b ≠ 0, ಆದ್ದರಿಂದ ${M(`(${ra}) / ${bd}`)} ಪರಿಮೇಯ. ಹಾಗಾಗಿ ${M('√'+c)} ಪರಿಮೇಯ.`,
e4:(E,c)=>`<b>ಹಂತ 4.</b> ಆದರೆ ${M('√'+c)} ಅಪರಿಮೇಯ (ಮೊದಲೇ ಸಾಧಿಸಲಾಗಿದೆ). <b class="hl">ಇದು ${M(E)} ಪರಿಮೇಯ ಎಂಬ ನಮ್ಮ ಊಹೆಗೆ ವಿರುದ್ಧ.</b>`,
eRes:E=>`ಆದ್ದರಿಂದ ${M(E)} <b>ಅಪರಿಮೇಯ</b>.`,
m1:'ಇಬ್ಬರೂ ಒಟ್ಟಿಗೆ ಹೊರಡುತ್ತಾರೆ. ಎರಡೂ ಸಮಯಗಳ ಗುಣಕವಾದ ಸಮಯದಲ್ಲಿ ಅವರು ಮತ್ತೆ ಪ್ರಾರಂಭ ಬಿಂದುವಿನಲ್ಲಿರುತ್ತಾರೆ, ಆದ್ದರಿಂದ ಕ.ಸಾ.ಅ ಬೇಕು.',
meet:l=>`ಅವರು ${l} ನಿಮಿಷಗಳ ನಂತರ ಪ್ರಾರಂಭ ಬಿಂದುವಿನಲ್ಲಿ ಮತ್ತೆ ಭೇಟಿಯಾಗುತ್ತಾರೆ.`},
p:[
{name:'1 · ಮೂಲಭೂತ ಪ್ರಮೇಯ',title:'ಅಂಕಗಣಿತದ ಮೂಲಭೂತ ಪ್ರಮೇಯ',tag:'ಪ್ರತಿ ಭಾಜ್ಯ ಸಂಖ್ಯೆಗೆ ಒಂದೇ ಒಂದು ಅವಿಭಾಜ್ಯ ಗುರುತು.',
key:'ಪ್ರತಿ ಭಾಜ್ಯ ಸಂಖ್ಯೆಯನ್ನು ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆಗಳ ಗುಣಲಬ್ಧವಾಗಿ ಬರೆಯಬಹುದು, ಮತ್ತು ಈ ವಿಭಜನೆ (ಕ್ರಮವನ್ನು ಹೊರತುಪಡಿಸಿ) ಅನನ್ಯ.',
facts:['ಅಪವರ್ತನ ವೃಕ್ಷದ ಮೂಲಕ ವಿಭಜಿಸಿ. ಅವಿಭಾಜ್ಯಗಳನ್ನು ಏರುಕ್ರಮದಲ್ಲಿ ಬರೆಯಿರಿ.',`ಸಮಾನ ಅವಿಭಾಜ್ಯಗಳನ್ನು ಘಾತಗಳಾಗಿ ಸೇರಿಸಿ: ${M('32760 = 2<sup>3</sup> × 3<sup>2</sup> × 5 × 7 × 13')}`,'ಕ್ರಮ (ಏರುಕ್ರಮ) ನಿಗದಿಯಾದ ಮೇಲೆ ವಿಭಜನೆ ಅನನ್ಯ.','ಮೊದಲ ಸರಿಯಾದ ಸಾಧನೆಯನ್ನು ಕಾರ್ಲ್ ಫ್ರೆಡ್ರಿಕ್ ಗಾಸ್ ನೀಡಿದರು; ಅವರನ್ನು ‘ಗಣಿತಜ್ಞರ ರಾಜಕುಮಾರ’ ಎನ್ನುತ್ತಾರೆ.']},
{name:'2 · ಮ.ಸಾ.ಅ ಮತ್ತು ಕ.ಸಾ.ಅ',title:'ಅವಿಭಾಜ್ಯ ಅಪವರ್ತನದಿಂದ ಮ.ಸಾ.ಅ ಮತ್ತು ಕ.ಸಾ.ಅ',tag:'ಮ.ಸಾ.ಅ ಗೆ ಚಿಕ್ಕ ಘಾತ, ಕ.ಸಾ.ಅ ಗೆ ದೊಡ್ಡ ಘಾತ.',
key:M('HCF(a, b) × LCM(a, b) = a × b'),
facts:['ಮ.ಸಾ.ಅ (HCF) = ಪ್ರತಿ ಸಾಮಾನ್ಯ ಅವಿಭಾಜ್ಯ ಅಪವರ್ತನದ ಚಿಕ್ಕ ಘಾತಗಳ ಗುಣಲಬ್ಧ.','ಕ.ಸಾ.ಅ (LCM) = ಒಳಗೊಂಡ ಪ್ರತಿ ಅವಿಭಾಜ್ಯದ ದೊಡ್ಡ ಘಾತಗಳ ಗುಣಲಬ್ಧ.',`${M('HCF × LCM = a × b')}, ಆದ್ದರಿಂದ ${M('LCM = (a × b) / HCF')}.`,`ಉದಾಹರಣೆ: ${M('HCF(96, 404) = 4')}, ಆದ್ದರಿಂದ LCM = 9696.`]},
{name:'3 · ಮೂರು ಸಂಖ್ಯೆಗಳು',title:'ಮೂರು ಸಂಖ್ಯೆಗಳ ಮ.ಸಾ.ಅ ಮತ್ತು ಕ.ಸಾ.ಅ',tag:'ಎಚ್ಚರ: ಗುಣಲಬ್ಧ ನಿಯಮ ಮೂರು ಸಂಖ್ಯೆಗಳಿಗೆ ಅನ್ವಯಿಸುವುದಿಲ್ಲ.',
key:'ಮೂರು ಸಂಖ್ಯೆಗಳಿಗೆ HCF × LCM, ಆ ಸಂಖ್ಯೆಗಳ ಗುಣಲಬ್ಧಕ್ಕೆ ಸಮನಾಗಿರುವುದಿಲ್ಲ.',
facts:['ಅದೇ ವಿಧಾನ: ಮ.ಸಾ.ಅ ಗೆ ಸಾಮಾನ್ಯ ಅವಿಭಾಜ್ಯಗಳ ಚಿಕ್ಕ ಘಾತ, ಕ.ಸಾ.ಅ ಗೆ ಎಲ್ಲದರ ದೊಡ್ಡ ಘಾತ.',`ಉದಾಹರಣೆ: ${M('6 = 2 × 3, 72 = 2<sup>3</sup> × 3<sup>2</sup>, 120 = 2<sup>3</sup> × 3 × 5')}`,`${M('HCF(6, 72, 120) = 6')} ಮತ್ತು ${M('LCM = 360')}.`,`ಆದರೆ ${M('6 × 72 × 120 ≠ HCF × LCM')}.`]},

const IN=[[['n',32760]],[['a',96],['b',404]],[['a',6],['b',72],['c',120]],[['b',4]],[['p',2]],[['a',5],['b',-1],['c',3]],[['t1',18],['t2',12]]];
const BD=[
([n])=>{if(!okInt(n,4,1e7))return['!'+T.s.err4];if(isPrime(n))return['!'+T.s.prime(n)];
 const o=[T.s.tree],pr=[];let c=n;while(c>1){let p=2;while(c%p)p++;const r=c/p;if(r>1)o.push(M(`${c} = ${p} × ${r}`));pr.push(p);c=r}
 o.push(T.s.primes+' '+M(pr.join(' × ')));o.push('§'+M(`${n} = ${fmt(factor(n))}`));o.push(T.s.unique);return o},
([a,b])=>{if(![a,b].every(x=>okInt(x,2,1e6)))return['!'+T.s.err2];const R=hl([a,b]);
 return[chip(a,R.F[0]),chip(b,R.F[1]),hv(T,R),lv(T,R),`${T.s.chk} ${M(`${R.h} × ${R.l} = ${R.h*R.l} = ${a} × ${b}`)}`,`${T.s.viaH} ${M(`${a} × ${b} / ${R.h} = ${R.l}`)}`,res(T,R)]},
([a,b,c])=>{if(![a,b,c].every(x=>okInt(x,2,1e4)))return['!'+T.s.err3];const R=hl([a,b,c]),P=a*b*c,Q=R.h*R.l;
 return[chip(a,R.F[0]),chip(b,R.F[1]),chip(c,R.F[2]),hv(T,R),lv(T,R),
 `${M(`${a} × ${b} × ${c} = ${P}`)}<br>${M(`HCF × LCM = ${R.h} × ${R.l} = ${Q}`)}<br>${P!=Q?T.s.prodNot:T.s.prodEq}`,res(T,R)]},
([b])=>{if(!okInt(b,2,1e6))return['!'+T.s.err2];const f=factor(b),ks=Object.keys(f),h2=!!f[2],h5=!!f[5];
 const sy=ks.map(p=>p+'<sup>'+(f[p]==1?'':f[p])+'n</sup>').join(' × ');
 return[T.s.zeroIdea,M(`${b}<sup>n</sup> = (${fmt(f)})<sup>n</sup> = ${sy}`),`${T.s.onlyP} ${M(ks.join(', '))}`,T.s.uniq,'§'+(h2&&h5?T.s.can(b):T.s.never(b,h5?2:5))]},
([p])=>{if(!isPrime(p))return['!'+T.s.prErr];return[...T.s.irr(p),'§'+T.s.irrRes(p)]},
([a,b,c])=>{if(!isPrime(c)||!b||!Number.isInteger(a)||!Number.isInteger(b))return['!'+T.s.eErr];
 const ab=Math.abs(b),E=(a?a+(b<0?' − ':' + '):(b<0?'−':''))+(ab==1?'':ab)+'√'+c;
 const ra=a?`r ${a<0?'+':'−'} ${Math.abs(a)}`:'r',bt=(b==1?'':b==-1?'−':b)+'√'+c,bd=b<0?`(${b})`:b;
 return[T.s.e1(E),T.s.e2(bt,ra,c,bd),T.s.e3(ra,bd,c),T.s.e4(E,c),'§'+T.s.eRes(E)]},
([x,y])=>{if(![x,y].every(v=>okInt(v,2,1e4)))return['!'+T.s.err3];const R=hl([x,y]);
 return[T.s.m1,chip(x,R.F[0]),chip(y,R.F[1]),lv(T,R),'§'+T.s.meet(M(R.l))]}
];
const POSTERS=T.p.map((p,i)=>({...p,inputs:IN[i],build:BD[i]}));
const N=POSTERS.length;let cur=0,tok=0;
const nav=$('#nav'),main=$('#main');
POSTERS.forEach((P,i)=>{
 const b=document.createElement('button');b.textContent=P.name;b.onclick=()=>show(i);nav.appendChild(b);
 const s=document.createElement('section');s.className='poster';
 s.innerHTML=`<div><h1>${P.title}</h1><div class="tag">${P.tag}</div><ul class="facts">${P.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>
 <div><div class="ctl">${P.inputs.map(([n,v])=>`<label>${n}<input type="number" value="${v}"></label>`).join('')}
 <button class="go">${T.run}</button><button class="st">${T.step}</button><button class="rs">${T.reset}</button></div><div class="stage"></div></div>`;
 main.appendChild(s);P.el=s;P.stage=$('.stage',s);
 $('.go',s).onclick=()=>play();$('.st',s).onclick=()=>step();$('.rs',s).onclick=()=>{tok++;kids().forEach(k=>k.classList.remove('on'))};
 s.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')play()}));
});
const kids=()=>[...POSTERS[cur].stage.children];
function build(){const P=POSTERS[cur];const v=[...P.el.querySelectorAll('input')].map(i=>+i.value);
 P.stage.innerHTML=`<div class="key"><b>${T.keyLabel}</b> ${P.key}</div>`+P.build(v).map(h=>{const r=h[0]=='§',bad=h[0]=='!';return `<div class="${r?'result':bad?'bad':''}">${r||bad?h.slice(1):h}</div>`}).join('')}
async function play(){build();const my=++tok;await sleep(300);for(const k of kids()){if(my!==tok)return;k.classList.add('on');await sleep(1800)}}
function step(){tok++;let n=kids().find(k=>!k.classList.contains('on'));if(!n){build();n=kids()[0]}n.classList.add('on')}
function show(i){tok++;cur=i;POSTERS.forEach((P,j)=>P.el.classList.toggle('on',j==i));[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i));play()}
const RT=document.documentElement.dir=='rtl',NX=RT?'ArrowLeft':'ArrowRight',PV=RT?'ArrowRight':'ArrowLeft';
document.addEventListener('keydown',e=>{
 if(e.key===NX)show((cur+1)%N);else if(e.key===PV)show((cur+N-1)%N);
 else if(e.key===' '){e.preventDefault();play()}else if(e.key==='s'||e.key==='S')step();
 else if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean')});
show(Math.min(N-1,Math.max(0,(+location.hash.slice(1)||1)-1)));
</script>
